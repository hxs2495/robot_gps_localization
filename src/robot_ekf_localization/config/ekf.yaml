### ekf config file ###
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    
    # 滤波器输出位置估计的频率（Hz）
    frequency: 30.0
    
    # 传感器超时时间（秒）
    sensor_timeout: 0.1
    
    # 是否使用2D模式
    two_d_mode: true
    
    # 变换时间偏移
    #transform_time_offset: 0.0
    
    # 变换超时时间
    transform_timeout: 0.0
    
    # 打印诊断信息
    # print_diagnostics: true
    
    # 调试模式
    debug: false
    
    # 调试输出文件
    # debug_out_file: "/path/to/debug/file.txt"
    
    # 是否允许旧测量重新发布更新状态
    # permit_corrected_publication: false
    
    # 是否发布加速度状态
    # publish_acceleration: false
    
    # 是否通过/tf话题广播变换
    publish_tf: true
    map_frame:	map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    predict_to_current_time: true

    # ODOM配置
    odom0: /odom

    # 仅使用前向速度 vx
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]

    odom0_queue_size: 5
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: true
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 5.0
    
    # IMU配置
    ####################################################
    # IMU
    ####################################################
    imu0: /imu

    # 使用 yaw 和 vyaw
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    # imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_pose_rejection_threshold: 10.0
    imu0_twist_rejection_threshold: 10.0
    # imu0_linear_acceleration_rejection_threshold: 0.8
    imu0_remove_gravitational_acceleration: true
    
    # 过程噪声协方差矩阵
