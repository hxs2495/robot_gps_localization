gpgga_filter_node:
  ros__parameters:
    # NavSatFix.status.status最低要求。-1允许STATUS_NO_FIX，由后级再次检查有效FIX。
    required_status: 2 # -1: STATUS_NO_FIX, 0: STATUS_FIX, 1: STATUS_SBAS_FIX, 2: STATUS_GBAS_FIX 根据实际数据状态情况选择设置过滤
    recover_frame_count: 1

gps_to_utm_odometry_node:
  ros__parameters:
    frame_id: utm
    child_frame_id: gps
    # 航向用于把ENU/UTM轨迹旋转到机器人启动方向。
    use_orientation: true
    # north_clockwise: 北向为0、顺时针为正；enu: REP-103东向为0、逆时针为正。
    orientation_convention: north_clockwise
    # 航向固定零偏(rad)，在GPS杆臂补偿和map原点初始化之前加到ENU yaw。
    # all-data-8-23-4中同时刻轨迹刚体拟合得到GPS相对local多旋转约1.70°；
    # 加+1.70°会使建立的GPS map轴反向旋转1.70°，与local/odom轴对齐。
    orientation_yaw_offset: 0.0297
    # GPS测量物理时刻相对header.stamp的补偿(s)；正值把输出时标向后移。
    # 回放拟合中GPS位置与FAST-LIO最佳对齐约为+0.08s，可减小转弯段横向残差。
    measurement_time_offset: 0.08
    # 航向消息未提供有效orientation_covariance[8]时的yaw方差(rad^2)。
    orientation_variance: 0.04
    unobserved_orientation_variance: 1000000.0
    # 防止未知/全零协方差让EKF把GPS当成无噪声观测。
    position_variance_floor: 0.01
    unknown_position_variance: 4.0
    # GPS与航向按header.stamp配对，避免转弯时使用上一帧航向。
    sync_queue_size: 20
    max_orientation_time_offset: 0.05

gps_global_odometry_node:
  ros__parameters:
    # GPS是全局绝对观测，必须直接属于map，避免经map->odom回灌全局EKF。
    global_frame_id: map
    init_frames: 10
    two_d_mode: true
    # 默认关闭，避免和FAST-LIO或robot_localization重复发布odom->base_footprint。
    publish_tf: false
    # 发布转换后GPS轨迹，供RViz与FAST-LIO的/fastlio_path对比。
    publish_path: true
    path_topic: /gps_path
    # 小于该距离的相邻GPS点不加入轨迹；设为0保留每帧。
    path_min_distance: 0.05
    # 只保留最新点以限制内存；设为0表示不限制。
    path_max_points: 10000
    # GPS天线到base_footprint的全部平移/旋转只从URDF静态TF读取。
    transform_timeout: 0.2
